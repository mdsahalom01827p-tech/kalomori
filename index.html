<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>কালো মরিচ</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#111827;
color:#fff;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
}

.container{
width:95%;
max-width:420px;
background:#1f2937;
padding:25px;
border-radius:15px;
text-align:center;
box-shadow:0 0 15px rgba(0,0,0,.3);
}

h1{
color:#00ff88;
margin-bottom:15px;
}

#userInfo{
margin:20px 0;
line-height:28px;
font-size:17px;
}

button{
width:100%;
padding:15px;
font-size:18px;
border:none;
border-radius:10px;
background:#00c853;
color:#fff;
cursor:pointer;
}
</style>

</head>

<body>

<div class="container">

<h1>🌶️ কালো মরিচ</h1>

<div id="userInfo">
লোড হচ্ছে...
</div>

<button id="startBtn">
কাজ শুরু করুন
</button>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

const firebaseConfig = {
  apiKey: "AIzaSyBJu9oZvK4K3q7tjFuHicz-522lXVnRhDU",
  authDomain: "kalomori-a637b.firebaseapp.com",
  projectId: "kalomori-a637b",
  storageBucket: "kalomori-a637b.firebasestorage.app",
  messagingSenderId: "177260666749",
  appId: "1:177260666749:web:09c93a73bfcd37eab23614",
  measurementId: "G-W4L4EH2YG2"
};

const app = initializeApp(firebaseConfig);

const tg = window.Telegram.WebApp;
tg.ready();
tg.expand();

const user = tg.initDataUnsafe?.user;
    if (user) {
  document.getElementById("userInfo").innerHTML = `
    <h3>👋 স্বাগতম ${user.first_name}</h3>
    <p>🆔 ID: ${user.id}</p>
    <p>👤 Username: @${user.username || "নেই"}</p>
  `;
} else {
  document.getElementById("userInfo").innerHTML = `
    <h3>⚠️ Telegram Mini App থেকে খুলুন</h3>
  `;
}

document.getElementById("startBtn").addEventListener("click", () => {
  alert("কাজ শুরু হবে পরের ধাপে");
});console.log("Firebase Connected");
console.log("Telegram User:", user);

</script>

</div>

</body>
</html>
